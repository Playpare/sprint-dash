<!-- Live View page (sprint spaces). Loaded by core/core.js; filled by live-view/live-view.js. -->
<div class="page" id="page-live" data-section-label="Live View">
<div class="g2-app" id="g2App">
  <header class="g2-header">
    <h1 class="g2-title" id="g2Title">—</h1>
    <div class="g2-pills">
      <span class="g2-pill g2-date-pill"><b id="g2Start">—</b><span class="g2-dash">–</span><b id="g2End">—</b></span>
      <span class="g2-pill g2-live-pill" id="g2SyncState"><i></i>Next update —</span>
      <span class="g2-pill">Last updated <b id="g2Updated">—</b></span>
    </div>
    <div class="g2-count g2-glass">
      <div class="g2-count-icon"><svg viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/></svg></div>
      <div><b id="g2Count">—</b><small id="g2CountL">Time remaining</small></div>
    </div>
  </header>
  <div class="g2-body">
    <div class="g2-kpis">
      <div class="g2-glass g2-kpi" style="--g2c:var(--g2-todo)"><div class="g2-kpi-label"><i></i>Total work</div><div class="g2-kpi-value" id="g2Total">—</div></div>
      <div class="g2-glass g2-kpi" style="--g2c:var(--g2-prog)"><div class="g2-kpi-label"><i></i>Work left</div><div class="g2-kpi-value" id="g2Left">—</div></div>
      <div class="g2-glass g2-kpi" style="--g2c:var(--g2-done)"><div class="g2-kpi-label"><i></i>Time left</div><div class="g2-kpi-value" id="g2Time">—</div></div>
      <div class="g2-glass g2-kpi g2-alert" id="g2BehindCard" style="--g2c:var(--g2-review)"><div class="g2-kpi-label"><i></i><span id="g2BehindL">Hours behind</span></div><div class="g2-kpi-value" id="g2Behind">—</div><div class="g2-kpi-note" id="g2BehindNote">Behind the ideal burndown</div></div>
    </div>
    <section class="g2-glass g2-chart-card">
      <div class="g2-card-head"><h2>Burndown</h2><div class="g2-chart-legend"><span><i style="--g2c:var(--g2-review)"></i>Remaining</span><span><i style="--g2c:var(--g2-done)"></i>Time spent</span><span><i class="dash" style="--g2c:var(--g2-todo)"></i>Ideal</span></div></div>
      <div class="g2-chart" id="g2Chart"></div>
    </section>
    <aside class="g2-glass g2-status">
      <div class="g2-card-head"><h2>By status</h2><span class="g2-meta">All items</span></div>
      <div class="g2-donut-wrap"><div id="g2Donut"></div><div class="g2-donut-center"><b id="g2StatusTotal">0</b><span>Total</span></div></div>
      <div class="g2-status-list" id="g2StatusList"></div>
    </aside>
  </div>
</div>
<div class="lv-wrap lv-classic-view">
  <div class="lv-card lv-main">
    <div class="lv-head">
      <div class="lv-tw"><div class="lv-cap" id="lvCap"></div><div class="lv-title" id="lvTitle">—</div></div>
      <div class="lv-dates">
        <div class="lv-date"><div class="v" id="lvStart">—</div><div class="l">Start</div></div>
        <svg class="lv-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <div class="lv-date"><div class="v" id="lvEnd">—</div><div class="l">End</div></div>
      </div>
      <div class="lv-count"><div class="v" id="lvCount">—</div><div class="l" id="lvCountL">Time Remaining</div></div>
    </div>
    <div class="lv-stats">
      <div class="lv-stat"><div class="l">Total Work</div><div class="v" id="lvTotal">—</div></div>
      <div class="lv-stat"><div class="l">Work Left</div><div class="v" id="lvLeft">—</div></div>
      <div class="lv-stat"><div class="l">Time Left</div><div class="v" id="lvTime">—</div></div>
      <div class="lv-stat"><div class="l" id="lvBehindL">Hours Behind</div><div class="v" id="lvBehind">—</div></div>
    </div>
    <div class="lv-chart" id="lvChartWrap"><canvas id="lvC"></canvas></div>
  </div>
  <div class="lv-card lv-side">
    <div class="lv-sync" id="lvSync"></div>
    <div class="lv-donut"><canvas id="lvD"></canvas><div class="lv-donut-c"><div class="v" id="lvDTotal">0</div><div class="l">Total</div></div></div>
    <div class="lv-legend" id="lvLegend"></div>
  </div>
</div>
</div>
