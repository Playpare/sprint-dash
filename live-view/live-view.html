<!-- Live View page (sprint spaces). Loaded by core/core.js; filled by live-view/live-view.js. -->
<div class="page" id="page-live" data-section-label="Live View">
<div class="g2-app" id="g2App">
  <header class="g2-header">
    <div class="g2-head-left">
      <div class="g2-title-row"><h1 class="g2-title" id="g2Title">—</h1><span class="g2-dates"><span id="g2Start">—</span> – <span id="g2End">—</span></span></div>
    </div>
    <div class="g2-head-right">
      <div class="g2-sync"><span class="g2-live-pill" id="g2SyncState"><span class="g2-pulse"></span>Next update —</span><span class="g2-dot">·</span><span>Last updated <b id="g2Updated">—</b></span></div>
      <div class="g2-count"><b id="g2Count">—</b><small id="g2CountL">Time remaining</small></div>
    </div>
  </header>
  <div class="g2-kpis">
    <div class="g2-kpi" style="--g2c:#6ea8fe;--g2t:rgba(110,168,254,.12);--g2b:rgba(110,168,254,.26)">
      <div class="g2-kpi-top"><span class="g2-kpi-label">Total work</span><span class="g2-kpi-sub">Committed</span></div>
      <div class="g2-kpi-value" id="g2Total">—</div>
      <div class="g2-kpi-progress"><span class="g2-fill" id="g2TotalBar"></span></div>
    </div>
    <div class="g2-kpi" style="--g2c:#f5b942;--g2t:rgba(245,185,66,.12);--g2b:rgba(245,185,66,.26)">
      <div class="g2-kpi-top"><span class="g2-kpi-label">Work left</span><span class="g2-kpi-sub" id="g2LeftSub">—</span></div>
      <div class="g2-kpi-value" id="g2Left">—</div>
      <div class="g2-spark" id="g2LeftSpark"></div>
    </div>
    <div class="g2-kpi" style="--g2c:#3dd68c;--g2t:rgba(61,214,140,.12);--g2b:rgba(61,214,140,.26)">
      <div class="g2-kpi-top"><span class="g2-kpi-label">Time spent</span><span class="g2-kpi-sub" id="g2SpentSub">—</span></div>
      <div class="g2-kpi-value" id="g2Spent">—</div>
      <div class="g2-spark" id="g2SpentSpark"></div>
    </div>
    <div class="g2-kpi g2-alert" id="g2BehindCard" style="--g2c:#ff6b81;--g2t:rgba(255,107,129,.12);--g2b:rgba(255,107,129,.26)">
      <div class="g2-kpi-top"><span class="g2-kpi-label" id="g2BehindL">Hours behind</span><span class="g2-kpi-sub" id="g2BehindSub">vs. ideal</span></div>
      <div class="g2-kpi-value" id="g2Behind">—</div>
      <div class="g2-spark" id="g2BehindSpark"></div>
    </div>
  </div>
  <div class="g2-body">
    <section class="g2-card g2-chart-card">
      <div class="g2-card-head"><div class="g2-head-group"><h2>Burndown</h2><span class="g2-day-tag" id="g2DayLabel">—</span></div></div>
      <div class="g2-chart" id="g2Chart"></div>
    </section>
    <aside class="g2-card g2-status" id="g2StatusCard">
      <div class="g2-card-head"><h2>Items by status</h2><span class="g2-total"><b id="g2StatusTotal">—</b>Total</span></div>
      <div class="g2-status-list" id="g2StatusList"></div>
    </aside>
  </div>
  <!-- Low-priority footer: sits in the bottom strip that the desk monitors hide on the TV. -->
  <footer class="g2-foot">
    <div class="g2-timeline" id="g2Timeline"></div>
  </footer>
</div>
<div class="lv-wrap lv-classic-view">
  <div class="lv-card lv-main">
    <div class="lv-head">
      <div class="lv-tw"><div class="lv-cap" id="lvCap"></div><div class="lv-title" id="lvTitle">—</div></div>
      <div class="lv-dates">
        <div class="lv-date"><div class="v" id="lvStart">—</div><div class="l">Start</div></div>
        <svg class="lv-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <div class="lv-date"><div class="v" id="lvEnd">—</div><div class="l">End</div></div>
      </div>
      <div class="lv-count"><div class="v" id="lvCount">—</div><div class="l" id="lvCountL">Time Remaining</div></div>
    </div>
    <div class="lv-stats">
      <div class="lv-stat"><div class="l">Total Work</div><div class="v" id="lvTotal">—</div></div>
      <div class="lv-stat"><div class="l">Work Left</div><div class="v" id="lvLeft">—</div></div>
      <div class="lv-stat"><div class="l">Time Left</div><div class="v" id="lvTime">—</div></div>
      <div class="lv-stat"><div class="l" id="lvBehindL">Hours Behind</div><div class="v" id="lvBehind">—</div></div>
    </div>
    <div class="lv-chart" id="lvChartWrap"><canvas id="lvC"></canvas></div>
  </div>
  <div class="lv-card lv-side">
    <div class="lv-sync" id="lvSync"></div>
    <div class="lv-donut"><canvas id="lvD"></canvas><div class="lv-donut-c"><div class="v" id="lvDTotal">0</div><div class="l">Total</div></div></div>
    <div class="lv-legend" id="lvLegend"></div>
  </div>
</div>
</div>
